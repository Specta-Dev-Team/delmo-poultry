    <script>
      (function () {
        if (typeof window.AxGetGlobalVar !== "function") {
          window.AxGetGlobalVar = function (key) {
            try {
              if (window.parent && window.parent !== window && typeof window.parent.AxGetGlobalVar === "function") {
                return window.parent.AxGetGlobalVar(key);
              }
            } catch (error) {
              return "";
            }

            var stores = [window.AxGlobalVars, window.axGlobalVars, window.globalVars];
            for (var index = 0; index < stores.length; index += 1) {
              if (stores[index] && Object.prototype.hasOwnProperty.call(stores[index], key)) {
                return stores[index][key];
              }
            }

            return "";
          };
        }

        if (typeof window.AxSetGlobalVar !== "function") {
          window.AxSetGlobalVar = function (key, value) {
            window.axGlobalVars = window.axGlobalVars || {};
            window.axGlobalVars[key] = value;
          };
        }
      })();
    </script>
